<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pichulie</title>
    <link rel="stylesheet" href="../styles/header.styles.css">
</head>

<body>
    <header class="header">
        <div class="header__container">
            <!--- Logo Section --->
            <a class ="image__container" href ="../../pages/dashboard.html" target="_top">
                <img src="/logo-v2.png" alt="Pichulie Logo" class="image__logo">
            </a>
            
            <!--- Actions Section --->
            <div class="profile__container">
                
                <!-- Profile Avatar and Name-->
                <div class="user" onclick="toggleUserMenu()">
                    <span class="user__name" id="userName"></span>
                    <div class="user__avatar" id="userAvatar">
                        <img id="profilePicture" src="" alt="Profile" style="display: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                        <span id="userInitials"></span>
                    </div>
                </div>

                <!-- Button -->
                <button class="menu__btn">
                    <svg width="18" height="69" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4">
                        <line x1="0" y1="4" x2="24" y2="4"></line>
                        <line x1="0" y1="12" x2="24" y2="12"></line>
                        <line x1="0" y1="20" x2="24" y2="20"></line>
                    </svg>
                </button>

                <!-- Dropdown Menu -->
                <div class="btn__dropdown" aria-hidden="true">
                    <button id="editProfileBtn" class="drop__item">Edit Profile</button>
                    <button id="logoutBtn" class="drop__item" style="color: red;">Log out</button>
                    </div>
                </div>
           </div>
       </header>
    <script type="module" src="../scripts/header.controller.js"></script>
</body>
